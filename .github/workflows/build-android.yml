name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Capacitor 6
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Setup Capacitor config
        run: |
          rm -f capacitor.config.ts capacitor.config.json
          echo '{"appId":"com.s24seguridad.erp","appName":"S24 ERP","webDir":"dist","server":{"allowNavigation":["*"],"cleartext":true}}' > capacitor.config.json

      - name: Clean and add Android platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Internet Permissions
        run: |
          # Agregar permisos de internet al AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK Debug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S24-ERP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

Set-Location "C:\Users\fernando\s24-qwen"

$wfAbsolute = Join-Path (Get-Location) ".github\workflows"
New-Item -ItemType Directory -Force -Path $wfAbsolute | Out-Null

$webYml = @'
name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
'@

$utf8NoBom = [System.Text.UTF8Encoding]::new($false)
$webPath = Join-Path $wfAbsolute "web.yml"
[System.IO.File]::WriteAllText($webPath, $webYml, $utf8NoBom)

Write-Host "`n=== Workflows en el repo ===" -ForegroundColor Green
Get-ChildItem $wfAbsolute | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize

Write-Host "=== Verificación de web.yml ===" -ForegroundColor Cyan
Get-Content $webPath | Select-Object -First 5